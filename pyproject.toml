[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landslide-sfda"
version = "1.0.0"
description = "Paper-aligned diagnostics and repair for source-free cross-cluster landslide segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Zhuangzhi Wang"},
  {name = "Cun Weng"},
  {name = "Xinfang Chen"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
data = [
  "netCDF4>=1.6",
  "xarray>=2023.1",
]
cas = [
  "tifffile>=2023.7",
  "Pillow>=10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
